<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 50" width="100%" height="50">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0" />
      <stop offset="25%" stop-color="#C9A24B" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#E5C778" stop-opacity="1" />
      <stop offset="75%" stop-color="#C9A24B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left horizontal tapering line -->
  <line x1="40" y1="25" x2="250" y2="25" stroke="url(#divGold)" stroke-width="1.5" />
  
  <!-- Right horizontal tapering line -->
  <line x1="350" y1="25" x2="560" y2="25" stroke="url(#divGold)" stroke-width="1.5" />

  <!-- Center Ornate Medallion Flourish -->
  <g transform="translate(300, 25)" fill="#C9A24B" stroke="#B3202A" stroke-width="0.5">
    <!-- Center Diamond & Flower -->
    <circle cx="0" cy="0" r="5" fill="#B3202A" stroke="#C9A24B" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#FFE6A3" />

    <!-- Left Scroll Petals -->
    <path d="M -8 -2 C -18 -12 -30 -4 -25 5 C -20 12 -12 6 -6 2 Z" fill="#C9A24B" />
    <path d="M -25 5 C -35 12 -45 -2 -35 -8 C -28 -12 -22 -6 -24 -2" fill="none" stroke="#C9A24B" stroke-width="1.5" />
    <circle cx="-35" cy="-8" r="2" fill="#C9A24B" />

    <!-- Right Scroll Petals -->
    <path d="M 8 -2 C 18 -12 30 -4 25 5 C 20 12 12 6 6 2 Z" fill="#C9A24B" />
    <path d="M 25 5 C 35 12 45 -2 35 -8 C 28 -12 22 -6 24 -2" fill="none" stroke="#C9A24B" stroke-width="1.5" />
    <circle cx="35" cy="-8" r="2" fill="#C9A24B" />

    <!-- Small side beads -->
    <circle cx="-16" cy="0" r="2" fill="#C9A24B" />
    <circle cx="16" cy="0" r="2" fill="#C9A24B" />
    <circle cx="-50" cy="0" r="2.5" fill="#B3202A" stroke="#C9A24B" stroke-width="1" />
    <circle cx="50" cy="0" r="2.5" fill="#B3202A" stroke="#C9A24B" stroke-width="1" />
  </g>
</svg>
