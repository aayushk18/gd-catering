<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="herbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="60%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>
    <filter id="herbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#052E16" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#herbShadow)">
    <!-- Main Herb Stem -->
    <path d="M 80 140 C 75 110 72 80 65 30" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" />
    <!-- Branch Left -->
    <path d="M 72 85 C 55 75 40 65 25 55" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" />
    <!-- Branch Right -->
    <path d="M 70 70 C 88 60 105 50 120 40" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" />

    <!-- Top Leaf Cluster -->
    <g transform="translate(65, 30)">
      <path d="M 0 0 C -15 -10 -15 -25 0 -35 C 15 -25 15 -10 0 0 Z" fill="url(#herbGreen)" />
      <path d="M -8 -15 C -20 -15 -25 -5 -12 2 Z" fill="url(#herbGreen)" />
      <path d="M 8 -15 C 20 -15 25 -5 12 2 Z" fill="url(#herbGreen)" />
    </g>

    <!-- Left Leaf Cluster -->
    <g transform="translate(25, 55)">
      <path d="M 0 0 C -12 -8 -12 -22 0 -28 C 12 -22 12 -8 0 0 Z" fill="url(#herbGreen)" transform="rotate(-30)" />
      <path d="M -6 -12 C -18 -12 -20 -4 -10 2 Z" fill="url(#herbGreen)" transform="rotate(-30)" />
      <path d="M 6 -12 C 18 -12 20 -4 10 2 Z" fill="url(#herbGreen)" transform="rotate(-30)" />
    </g>

    <!-- Right Leaf Cluster -->
    <g transform="translate(120, 40)">
      <path d="M 0 0 C -12 -8 -12 -22 0 -28 C 12 -22 12 -8 0 0 Z" fill="url(#herbGreen)" transform="rotate(35)" />
      <path d="M -6 -12 C -18 -12 -20 -4 -10 2 Z" fill="url(#herbGreen)" transform="rotate(35)" />
      <path d="M 6 -12 C 18 -12 20 -4 10 2 Z" fill="url(#herbGreen)" transform="rotate(35)" />
    </g>
  </g>
</svg>
