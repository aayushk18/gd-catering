<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="100%" height="100%">
  <defs>
    <!-- Red Chilli Gradient -->
    <linearGradient id="redChilliGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FF3848" />
      <stop offset="40%" stop-color="#D91626" />
      <stop offset="85%" stop-color="#8E0813" />
      <stop offset="100%" stop-color="#55030A" />
    </linearGradient>

    <!-- Green Chilli Gradient -->
    <linearGradient id="greenChilliGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="40%" stop-color="#16A34A" />
      <stop offset="85%" stop-color="#14532D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B7A24" />
      <stop offset="100%" stop-color="#23420E" />
    </linearGradient>

    <filter id="chilliShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#3A0808" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#chilliShadow)">
    <!-- ================= GREEN CHILLI (BEHIND) ================= -->
    <g transform="translate(60, 20) rotate(15)">
      <!-- Green Stem -->
      <path d="M 22 2 C 16 -10 32 -18 36 -24" fill="none" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round" />
      <!-- Calyx / Cap -->
      <path d="M 12 4 C 18 10 30 10 34 2 C 34 8 28 12 24 14 C 18 12 14 8 12 4 Z" fill="url(#stemGrad)" />
      <!-- Green Body -->
      <path d="M 14 8 C 30 10 32 35 30 75 C 28 115 16 150 2 175 C -1 178 -1 174 2 165 C 10 135 16 100 16 65 C 16 35 12 18 14 8 Z" fill="url(#greenChilliGrad)" />
      <!-- Green Highlight Curve -->
      <path d="M 17 25 C 20 55 18 105 8 145" fill="none" stroke="#BBF7D0" stroke-width="1.8" opacity="0.6" stroke-linecap="round" />
    </g>

    <!-- ================= RED CHILLI (IN FRONT) ================= -->
    <g transform="translate(30, 10) rotate(-10)">
      <!-- Red Chilli Stem -->
      <path d="M 24 0 C 18 -12 26 -22 22 -30" fill="none" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" />
      <!-- Calyx / Cap -->
      <path d="M 10 5 C 18 12 34 12 38 4 C 36 12 30 16 24 18 C 18 15 12 10 10 5 Z" fill="url(#stemGrad)" />
      <!-- Red Body Curving Gracefully -->
      <path d="M 12 10 C 34 12 38 45 35 90 C 32 140 18 180 2 210 C -1 213 -1 209 3 198 C 12 160 20 120 20 75 C 20 40 14 22 12 10 Z" fill="url(#redChilliGrad)" />
      <!-- Glossy Reflection Sheen -->
      <path d="M 16 30 C 22 70 20 130 8 175" fill="none" stroke="#FFA3A8" stroke-width="2.2" opacity="0.75" stroke-linecap="round" />
    </g>
  </g>
</svg>
